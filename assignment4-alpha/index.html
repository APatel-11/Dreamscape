<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Dreamscape</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:system-ui,-apple-system,Segoe UI,Roboto;
}

#timeline{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:60%;
z-index:10;
}

#hud{
position:fixed;
top:12px;
left:12px;
color:white;
font-family:monospace;
z-index:10;
}

#timelineLabel{
position:fixed;
top:40px;
left:12px;
color:#aaa;
font-family:monospace;
font-size:12px;
z-index:10;
}

#fps{
position:fixed;
top:72px;
left:12px;
color:white;
font-family:monospace;
z-index:10;
}

#console{
position:fixed;
top:16px;
right:16px;
width:260px;
background:rgba(5,8,20,.72);
border:1px solid rgba(122,188,255,.25);
border-radius:14px;
padding:14px;
color:white;
z-index:20;
backdrop-filter:blur(8px);
box-shadow:0 0 24px rgba(60,100,255,.12);
}

#console input{
width:100%;
padding:8px;
border-radius:10px;
border:1px solid rgba(160,210,255,.18);
background:rgba(20,26,46,.8);
color:white;
margin-bottom:10px;
}

#console button{
width:48%;
padding:9px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
color:white;
background:linear-gradient(135deg,#5471ff,#47abff);
}

#console button.secondary{
background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.12);
}

#console .row{
display:flex;
gap:6px;
}

</style>
</head>

<body>

<input id="timeline" type="range" min="0" max="100" value="10"/>

<div id="hud">memory fragments: curated frames</div>
<div id="timelineLabel">timeline = point of view</div>
<div id="fps">fps: --</div>

<div id="console">
<b>Dreamscape Console</b><br><br>
<input id="memoryName" value="Memory 01"/>
<div class="row">
<button id="saveBtn">Save</button>
<button id="undoBtn" class="secondary">Undo</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

const scene=new THREE.Scene()
scene.fog=new THREE.FogExp2(0x111122,.02)

const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,.1,1000)
camera.position.set(0,4,11)

const renderer=new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth,window.innerHeight)
document.body.appendChild(renderer.domElement)

const controls=new THREE.OrbitControls(camera,renderer.domElement)
controls.enableDamping=true
controls.enablePan=false
controls.target.set(0,1.6,0)
controls.update()

const light=new THREE.PointLight(0xffffff,1)
light.position.set(5,10,5)
scene.add(light)

scene.add(new THREE.AmbientLight(0xffffff,.3))

/* sphere environment */

const sphere=new THREE.Mesh(
new THREE.SphereGeometry(30,64,64),
new THREE.MeshStandardMaterial({
color:0x0b0b14,
side:THREE.BackSide
})
)
scene.add(sphere)

/* platform */

const platform=new THREE.Mesh(
new THREE.CylinderGeometry(2.4,2.6,.3,48),
new THREE.MeshStandardMaterial({color:0x1a1a24})
)
platform.position.y=.1
scene.add(platform)

/* user placeholder */

const user=new THREE.Group()

const body=new THREE.Mesh(
new THREE.CylinderGeometry(.25,.25,1.2,16),
new THREE.MeshStandardMaterial({color:0x1c2038})
)
body.position.y=1
user.add(body)

const head=new THREE.Mesh(
new THREE.SphereGeometry(.18,20,20),
new THREE.MeshStandardMaterial({color:0x262a44})
)
head.position.y=1.8
user.add(head)

scene.add(user)

/* console */

const consolePanel=new THREE.Mesh(
new THREE.PlaneGeometry(2.6,1.4),
new THREE.MeshStandardMaterial({
color:0x9ad8ff,
transparent:true,
opacity:.15,
emissive:0x4c8cff,
emissiveIntensity:1
})
)

consolePanel.position.set(0,1.6,-2.4)
scene.add(consolePanel)

/* frames */

const frameGroup=new THREE.Group()
scene.add(frameGroup)

const frames=[]

function createFrame(){

const frame=new THREE.Mesh(
new THREE.PlaneGeometry(1.3,.8),
new THREE.MeshStandardMaterial({
color:0x402830,
transparent:true,
opacity:.7,
emissive:0x8f5b7a,
emissiveIntensity:.4
})
)

return frame
}

/* place frames in a sphere */

const FRAME_COUNT=12

for(let i=0;i<FRAME_COUNT;i++){

const frame=createFrame()

const angle=(i/FRAME_COUNT)*Math.PI*2
const radius=7

frame.position.set(
Math.cos(angle)*radius,
1.6+(Math.random()-.5)*3,
Math.sin(angle)*radius
)

frame.lookAt(0,1.6,0)

frame.userData.angle=angle
frame.userData.radius=radius
frame.userData.speed=.04+(Math.random()*.03)

frameGroup.add(frame)
frames.push(frame)

}

/* raycasting */

const raycaster=new THREE.Raycaster()
const mouse=new THREE.Vector2()
let selected=null

window.addEventListener("click",(e)=>{

mouse.x=(e.clientX/window.innerWidth)*2-1
mouse.y=-(e.clientY/window.innerHeight)*2+1

raycaster.setFromCamera(mouse,camera)
const hit=raycaster.intersectObjects(frames)

if(hit.length>0){

if(selected)selected.material.emissiveIntensity=.4

selected=hit[0].object
selected.material.emissiveIntensity=1.5

}

})

/* timeline */

const timeline=document.getElementById("timeline")

/* fps */

const fpsEl=document.getElementById("fps")
let lastTime=performance.now()
let frameCount=0

function animate(){

requestAnimationFrame(animate)

const t=timeline.value/100

/* slider only changes camera distance */

const desiredZ=11-(t*8)
camera.position.z+= (desiredZ-camera.position.z)*.05

/* orbit frames */

const time=performance.now()*.001

for(const frame of frames){

frame.userData.angle+=frame.userData.speed*.01

const a=frame.userData.angle
const r=frame.userData.radius

frame.position.x=Math.cos(a)*r
frame.position.z=Math.sin(a)*r

frame.lookAt(0,1.6,0)

}

controls.update()
renderer.render(scene,camera)

/* fps */

frameCount++
const now=performance.now()

if(now-lastTime>500){

fpsEl.textContent="fps: "+Math.round(frameCount*1000/(now-lastTime))

frameCount=0
lastTime=now

}

}

animate()

window.addEventListener("resize",()=>{

camera.aspect=window.innerWidth/window.innerHeight
camera.updateProjectionMatrix()
renderer.setSize(window.innerWidth,window.innerHeight)

})

</script>
</body>
</html>
