<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Dreamscape MVP Mockup</title>
<style>
  body { margin:0; overflow:hidden; background:black; }
  #timeline {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:60%;
    z-index: 10;
  }
</style>
</head>

<body>
<input id="timeline" type="range" min="0" max="100" value="50"/>

<div id="hud" style="position:fixed;top:12px;left:12px;color:white;font-family:monospace;z-index:10;">
  memory fragments: curated frames
</div>

<div id="fps" style="position:fixed;top:72px;left:12px;color:white;font-family:monospace;z-index:10;">
  fps: --
</div>

<div style="position:fixed;top:40px;left:12px;color:#aaa;font-family:monospace;font-size:12px;">
  timeline = memory clarity
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x111122, 0.02);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  
  controls.target.set(0, 1.6, -2.2);
  controls.enablePan = false;
  controls.minDistance = 0.1;
  controls.maxDistance = 2.5;
  controls.update();

  const light = new THREE.PointLight(0xffffff, 1);
  light.position.set(5, 10, 5);
  scene.add(light);

  const ambient = new THREE.AmbientLight(0xffffff, 0.25);
  scene.add(ambient);

  const sphereGeo = new THREE.SphereGeometry(30, 64, 64);
  const sphereMat = new THREE.MeshStandardMaterial({
    color: 0x0b0b14,
    side: THREE.BackSide,
    roughness: 1,
    metalness: 0
  });
  const museumSphere = new THREE.Mesh(sphereGeo, sphereMat);
  scene.add(museumSphere);

  const MEMORY_COUNT = 6;
  const savedNames = JSON.parse(localStorage.getItem("dreamscape_memory_names") || "null");
  const memories = Array.from({ length: MEMORY_COUNT }, (_, i) => ({
    id: i,
    name: savedNames?.[i] || `Memory ${String(i + 1).padStart(2, "0")}`,
    clarity: 0.5,
    tone: "neutral",
    edited: false,
    history: []
  }));

  let selectedMemoryId = 0;

  const framesGroup = new THREE.Group();
  scene.add(framesGroup);

  const frameMeshes = [];

  const platformGeo = new THREE.CylinderGeometry(1.8, 2.2, 0.4, 48);
  const platformMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a24,
    roughness: 0.7,
    metalness: 0.2,
    emissive: 0x101018,
    emissiveIntensity: 0.3
  });
  
  const platform = new THREE.Mesh(platformGeo, platformMat);
  platform.position.set(0, 0.2, 0);
  scene.add(platform);

  const consoleGroup = new THREE.Group();

  const pedestalGeo = new THREE.CylinderGeometry(0.7, 0.95, 1.0, 24);
  const pedestalMat = new THREE.MeshStandardMaterial({
    color: 0x171724,
    roughness: 0.45,
    metalness: 0.35,
    emissive: 0x0c0c18,
    emissiveIntensity: 0.35
  });
  
  const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
  pedestal.position.set(0, 0.5, 0);
  consoleGroup.add(pedestal);

  const mainScreenGeo = new THREE.PlaneGeometry(1.6, 0.95);
  const mainScreenMat = new THREE.MeshStandardMaterial({
    color: 0x6ab7ff,
    transparent: true,
    opacity: 0.32,
    emissive: 0x3366ff,
    emissiveIntensity: 0.95,
    side: THREE.DoubleSide
  });
  
  const mainScreen = new THREE.Mesh(mainScreenGeo, mainScreenMat);
  mainScreen.position.set(0, 1.55, 0.38);
  mainScreen.rotation.x = -0.32;
  consoleGroup.add(mainScreen);

  const sideGeo = new THREE.PlaneGeometry(0.6, 0.42);
  const sideMat = new THREE.MeshStandardMaterial({
    color: 0x8fd3ff,
    transparent: true,
    opacity: 0.22,
    emissive: 0x4f7fff,
    emissiveIntensity: 0.75,
    side: THREE.DoubleSide
  });

  const leftPane = new THREE.Mesh(sideGeo, sideMat.clone());
  leftPane.position.set(-0.95, 1.45, 0.18);
  leftPane.rotation.y = 0.28;
  leftPane.rotation.x = -0.15;
  consoleGroup.add(leftPane);

  const rightPane = new THREE.Mesh(sideGeo, sideMat.clone());
  rightPane.position.set(0.95, 1.45, 0.18);
  rightPane.rotation.y = -0.28;
  rightPane.rotation.x = -0.15;
  consoleGroup.add(rightPane);

  const lineMat = new THREE.MeshStandardMaterial({
    color: 0xb9e4ff,
    emissive: 0x66ccff,
    emissiveIntensity: 1.0
  });

  const uiLine1 = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.03), lineMat);
  uiLine1.position.set(0, 1.76, 0.39);
  uiLine1.rotation.x = -0.32;
  consoleGroup.add(uiLine1);

  const uiLine2 = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.03), lineMat);
  uiLine2.position.set(0, 1.60, 0.39);
  uiLine2.rotation.x = -0.32;
  consoleGroup.add(uiLine2);

  const uiLine3 = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.03), lineMat);
  uiLine3.position.set(-0.22, 1.43, 0.39);
  uiLine3.rotation.x = -0.32;
  consoleGroup.add(uiLine3);

  consoleGroup.position.set(0, 0, -2.6);
  consoleGroup.lookAt(0, 1.4, 0);
  scene.add(consoleGroup);

  function createFrame() {
    const frame = new THREE.Group();

    const outerGeo = new THREE.BoxGeometry(1.6, 1.1, 0.08);
    const outerMat = new THREE.MeshStandardMaterial({
      color: 0x2a2544,
      roughness: 0.35,
      emissive: 0x120830,
      emissiveIntensity: 0.35
    });
    const outer = new THREE.Mesh(outerGeo, outerMat);
    frame.add(outer);

    const innerGeo = new THREE.PlaneGeometry(1.35, 0.85);
    const innerMat = new THREE.MeshStandardMaterial({
      color: 0x1b1830,
      emissive: 0x221144,
      emissiveIntensity: 0.45
    });
    const inner = new THREE.Mesh(innerGeo, innerMat);
    inner.position.z = 0.05;
    frame.add(inner);

    frame.userData.outerMat = outerMat;
    frame.userData.innerMat = innerMat;

    return frame;
  }

  function layoutFrames() {
    framesGroup.clear();
    frameMeshes.length = 0;
  
    const layouts = [
      { count: 8, radius: 7.5, y: 1.8, tilt: 0.0, speed: 0.08 },   // middle ring
      { count: 6, radius: 6.5, y: 4.5, tilt: 0.35, speed: 0.05 },  // upper ring
      { count: 6, radius: 6.5, y: -1.0, tilt: -0.35, speed: -0.06 } // lower ring
    ];
  
    let memoryIndex = 0;
  
    for (let ringIndex = 0; ringIndex < layouts.length; ringIndex++) {
      const ring = layouts[ringIndex];
  
      for (let i = 0; i < ring.count; i++) {
        const frame = createFrame();
        const angle = (i / ring.count) * Math.PI * 2;
  
        frame.position.set(
          Math.cos(angle) * ring.radius,
          ring.y,
          Math.sin(angle) * ring.radius
        );
  
        frame.rotation.y = -angle + Math.PI / 2;
        frame.rotation.x = ring.tilt;
  
        frame.userData.memoryId = memoryIndex % MEMORY_COUNT;
  
        frame.userData.baseAngle = angle;
        frame.userData.radius = ring.radius;
        frame.userData.baseY = ring.y;
        frame.userData.tilt = ring.tilt;
        frame.userData.ringSpeed = ring.speed;
        frame.userData.floatOffset = Math.random() * Math.PI * 2;
        frame.userData.ringIndex = ringIndex;
  
        memoryIndex++;
  
        framesGroup.add(frame);
        frameMeshes.push(frame);
      }
    }
  }
  
  layoutFrames();

  const hud = document.getElementById("hud");
  hud.textContent = "memory fragments: curated frames";

  const timeline = document.getElementById("timeline");

  const fpsEl = document.getElementById("fps");
  let lastFpsTime = performance.now();
  let frames = 0;

  function animate() {
    requestAnimationFrame(animate);
  
    const t = Number(timeline.value) / 100;
    const time = performance.now() * 0.001;
  
    // timeline -> visuals
    scene.fog.density = 0.01 + t * 0.05;
  
    for (const frame of frameMeshes) {
      const angle = frame.userData.baseAngle + time * frame.userData.ringSpeed;
      const radius = frame.userData.radius;
      const floatY = Math.sin(time * 0.9 + frame.userData.floatOffset) * 0.22;
  
      frame.position.x = Math.cos(angle) * radius;
      frame.position.z = Math.sin(angle) * radius;
      frame.position.y = frame.userData.baseY + floatY;
  
      frame.rotation.y = -angle + Math.PI / 2;
      frame.rotation.x = frame.userData.tilt + Math.sin(time * 0.7 + frame.userData.floatOffset) * 0.05;
      frame.rotation.z = Math.cos(time * 0.6 + frame.userData.floatOffset) * 0.04;
    }
  
    consoleGroup.position.y = Math.sin(time * 1.2) * 0.04;
    consoleGroup.rotation.y = Math.sin(time * 0.35) * 0.05;
  
    controls.update();
    renderer.render(scene, camera);
  
    frames++;
    const now = performance.now();
    if (now - lastFpsTime >= 500) {
      const fps = Math.round((frames * 1000) / (now - lastFpsTime));
      fpsEl.textContent = "fps: " + fps;
      frames = 0;
      lastFpsTime = now;
    }
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
