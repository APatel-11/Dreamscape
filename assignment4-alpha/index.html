<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Dreamscape MVP Mockup</title>
<style>
  body { margin:0; overflow:hidden; background:black; }
  #timeline {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:60%;
    z-index: 10;
  }
</style>
</head>

<body>
<input id="timeline" type="range" min="0" max="100" value="50"/>

<div id="hud" style="position:fixed;top:12px;left:12px;color:white;font-family:monospace;z-index:10;">
  memory fragments: 1000
</div>

<div id="fps" style="position:fixed;top:72px;left:12px;color:white;font-family:monospace;z-index:10;">
  fps: --
</div>

<div style="position:fixed;top:40px;left:12px;color:#aaa;font-family:monospace;font-size:12px;">
timeline = memory clarity
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x111122, 0.02);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  
  controls.target.set(0, 1.6, -2.2);
  controls.enablePan = false;
  controls.minDistance = 0.1;
  controls.maxDistance = 2.5;
  controls.update();

  const light = new THREE.PointLight(0xffffff, 1);
  light.position.set(5, 10, 5);
  scene.add(light);

  const ambient = new THREE.AmbientLight(0xffffff, 0.25);
  scene.add(ambient);

  const sphereGeo = new THREE.SphereGeometry(30, 64, 64);
  const sphereMat = new THREE.MeshStandardMaterial({
    color: 0x0b0b14,
    side: THREE.BackSide,
    roughness: 1,
    metalness: 0
  });
  const museumSphere = new THREE.Mesh(sphereGeo, sphereMat);
  scene.add(museumSphere);

  const MEMORY_COUNT = 6;
  const savedNames = JSON.parse(localStorage.getItem("dreamscape_memory_names") || "null");
  const memories = Array.from({ length: MEMORY_COUNT }, (_, i) => ({
    id: i,
    name: savedNames?.[i] || `Memory ${String(i + 1).padStart(2, "0")}`,
    clarity: 0.5,
    tone: "neutral",
    edited: false,
    history: []
  }));

  let selectedMemoryId = 0;

  const framesGroup = new THREE.Group();
  scene.add(framesGroup);

  const frameMeshes = [];

  const platformGeo = new THREE.CylinderGeometry(1.8, 2.2, 0.4, 48);
  const platformMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a24,
    roughness: 0.7,
    metalness: 0.2,
    emissive: 0x101018,
    emissiveIntensity: 0.3
  });
  
  const platform = new THREE.Mesh(platformGeo, platformMat);
  platform.position.set(0, 0.2, 0);
  scene.add(platform);

  const consoleGroup = new THREE.Group();

  const pedestalGeo = new THREE.BoxGeometry(1.2, 1.0, 0.8);
  const pedestalMat = new THREE.MeshStandardMaterial({
    color: 0x181826,
    roughness: 0.5,
    metalness: 0.25,
    emissive: 0x0a0a18,
    emissiveIntensity: 0.3
  });
  const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
  pedestal.position.set(0, 0.8, 0);
  consoleGroup.add(pedestal);

  const screenGeo = new THREE.PlaneGeometry(1.2, 0.75);
  const screenMat = new THREE.MeshStandardMaterial({
    color: 0x66aaff,
    emissive: 0x3366ff,
    emissiveIntensity: 0.7
  });
  const screen = new THREE.Mesh(screenGeo, screenMat);
  screen.position.set(0, 1.3, 0.42);
  consoleGroup.add(screen);

  consoleGroup.position.set(0, 0, -2.2);
  consoleGroup.lookAt(0, 1.2, 0);
  scene.add(consoleGroup);

  function createFrame() {
    const frame = new THREE.Group();

    const outerGeo = new THREE.BoxGeometry(1.6, 1.1, 0.08);
    const outerMat = new THREE.MeshStandardMaterial({
      color: 0x2a2544,
      roughness: 0.35,
      emissive: 0x120830,
      emissiveIntensity: 0.35
    });
    const outer = new THREE.Mesh(outerGeo, outerMat);
    frame.add(outer);

    const innerGeo = new THREE.PlaneGeometry(1.35, 0.85);
    const innerMat = new THREE.MeshStandardMaterial({
      color: 0x1b1830,
      emissive: 0x221144,
      emissiveIntensity: 0.45
    });
    const inner = new THREE.Mesh(innerGeo, innerMat);
    inner.position.z = 0.05;
    frame.add(inner);

    frame.userData.outerMat = outerMat;
    frame.userData.innerMat = innerMat;

    return frame;
  }

    function layoutFrames() {
      framesGroup.clear();
      frameMeshes.length = 0;
  
      const layouts = [
        { count: 8, radius: 7.5, y: 1.8, tilt: 0 }, 
        { count: 6, radius: 6.5, y: 4.5, tilt: 0.35 },  
        { count: 6, radius: 6.5, y: -1.0, tilt: -0.35 } 
      ];
  
      let memoryIndex = 0;
  
      for (const ring of layouts) {
        for (let i = 0; i < ring.count; i++) {
          const frame = createFrame();
          const angle = (i / ring.count) * Math.PI * 2;
  
          frame.position.set(
            Math.cos(angle) * ring.radius,
            ring.y,
            Math.sin(angle) * ring.radius
          );
  
          frame.rotation.y = -angle + Math.PI / 2;
          frame.rotation.x = ring.tilt;
  
          frame.userData.memoryId = memoryIndex % MEMORY_COUNT;
          memoryIndex++;
  
          framesGroup.add(frame);
          frameMeshes.push(frame);
        }
      }
    }
  
  layoutFrames();

  const hud = document.getElementById("hud");
  hud.textContent = "memory fragments: curated frames";

  const timeline = document.getElementById("timeline");

  const fpsEl = document.getElementById("fps");
  let lastFpsTime = performance.now();
  let frames = 0;

  function animate() {
    requestAnimationFrame(animate);

    const t = Number(timeline.value) / 100;

    // timeline -> visuals
    scene.fog.density = 0.01 + t * 0.05;
    controls.update();
    renderer.render(scene, camera);

    frames++;
    const now = performance.now();
    if (now - lastFpsTime >= 500) {
      const fps = Math.round((frames * 1000) / (now - lastFpsTime));
      fpsEl.textContent = "fps: " + fps;
      frames = 0;
      lastFpsTime = now;
    }
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
